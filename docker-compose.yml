services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      TZ: ${TZ:-Europe/Budapest}
      PGTZ: ${TZ:-Europe/Budapest}
    volumes:
      - nexus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@db:5432/${POSTGRES_DB:-nexus}
      TZ: ${TZ:-Europe/Budapest}
      PORT: 3000
      DOMAIN: ${DOMAIN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets the app reach e.g. Ollama running on the host
    ports:
      # Locally only reachable from this machine. On a VM put a reverse proxy (Caddy/nginx) in front,
      # or change to "3000:3000" together with DASHBOARD_PASSWORD.
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-3000}:3000"

  # Public HTTPS entry point for a VM: `docker compose --profile public up -d` (needs DOMAIN in .env).
  # Caddy gets and renews the Let's Encrypt certificate by itself.
  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-}
    # interpolation runs even when the profile is off, so check DOMAIN here instead of with ${DOMAIN:?}
    command: sh -c 'test -n "$$DOMAIN" || { echo "Set DOMAIN in .env, e.g. dash.example.com"; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Private access from anywhere through Cloudflare (no open ports, no fixed IP):
  # `docker compose --profile tunnel up -d` with TUNNEL_TOKEN in .env (Cloudflare Zero Trust → Tunnels).
  # In the tunnel's public hostname set the service to http://app:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-} # cloudflared reads the token from this variable (the image has no shell)
    command: tunnel --no-autoupdate run

volumes:
  nexus-db:
  caddy-data:
  caddy-config:
